{% extends 'base.html' %}
{% load static %}

{% block title %}Iniciar Sesion - Soporte Técnico{% endblock %}

{% block content %}
<div class="login-container">
    <div class="card card-login">
        <div class="login-header">
            <img src="{% static 'img/logo.png' %}" alt="Logo" class="login-logo">
            <h1>Soporte Técnico</h1>
            <p>Acceso Técnicos y Administradores</p>
        </div>

        <form method="post" class="form-login">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" name="username" id="username" class="form-control" required autofocus placeholder="Ingrese su usuario">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" name="password" id="password" class="form-control" required placeholder="Ingrese su contraseña">
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block">
                Iniciar Sesion
            </button>
        </form>

        <div class="login-footer">
            <a href="{% url 'landing' %}">Volver a la pagina principal</a>
        </div>
    </div>
</div>
{% endblock %}
